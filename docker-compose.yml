# Local development stack. Credentials here are throwaway defaults.
# For production use docker-compose.prod.yml, which reads secrets from .env.

services:
  cleargate-proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_DSN=postgres://user:password@db:5432/cleargate?sslmode=disable
      - JWT_SECRET=dev-only-insecure-secret
      - QDRANT_ADDR=qdrant:6334
      - REDIS_ADDR=redis:6379
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - cleargate-net

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cleargate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cleargate-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cleargate"]
      interval: 3s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.1.1
    volumes:
      - qdrant_data:/qdrant/storage
    # Exposed to the host so the check_vector helper can be run locally.
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - cleargate-net

  redis:
    image: redis:alpine
    networks:
      - cleargate-net

networks:
  cleargate-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
