events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    server {
        listen 80;
        server_name localhost;

        # Dashboard: the cleargate-frontend container builds the React app and
        # serves the static bundle on port 80 (see dashboard/Dockerfile).
        location / {
            proxy_pass http://cleargate-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend API
        location /api/ {
            proxy_pass http://cleargate-proxy:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth Routes
        location /auth/ {
            proxy_pass http://cleargate-proxy:8080;
        }
    }
}
